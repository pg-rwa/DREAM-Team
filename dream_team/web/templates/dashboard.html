<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAM Team</title>
    <style>
        :root {
            --bg: #0a0e17;
            --surface: #111827;
            --surface2: #1a2332;
            --border: #1e293b;
            --text: #e0e6f0;
            --text-dim: #64748b;
            --cyan: #06b6d4;
            --purple: #8b5cf6;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 20px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { border-color: var(--cyan); }
        .btn-primary {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border: none; color: white;
        }
        .btn-sm { padding: 4px 10px; font-size: 12px; }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            grid-template-rows: 1fr;
            height: calc(100vh - 57px);
        }

        /* Sidebar */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
        }
        .sidebar-section {
            margin-bottom: 24px;
        }
        .sidebar-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .agent-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .agent-card:hover { border-color: var(--cyan); }
        .agent-card.active { border-color: var(--purple); }
        .agent-card .name { font-weight: 600; font-size: 14px; }
        .agent-card .meta {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-idle { background: rgba(16,185,129,0.15); color: var(--green); }
        .status-working { background: rgba(245,158,11,0.15); color: var(--yellow); }
        .status-error { background: rgba(239,68,68,0.15); color: var(--red); }

        /* Main area */
        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Chat/CTO area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .message {
            margin-bottom: 20px;
            max-width: 85%;
        }
        .message.user {
            margin-left: auto;
        }
        .message-header {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .message-header .role { font-weight: 600; }
        .message-body {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user .message-body {
            background: var(--surface2);
            border-color: var(--purple);
        }
        .message.cto .message-body {
            border-color: var(--cyan);
        }
        .message.system .message-body {
            border-color: var(--yellow);
            font-size: 12px;
            color: var(--text-dim);
        }

        /* Input */
        .input-area {
            padding: 16px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }
        .input-row {
            display: flex;
            gap: 12px;
        }
        .input-row input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        .input-row input:focus { border-color: var(--cyan); }
        .input-row input::placeholder { color: var(--text-dim); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
        }
        .modal h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--cyan); }
        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Tasks panel */
        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .task-icon { font-size: 14px; }
        .task-title { flex: 1; }
        .task-project {
            font-size: 11px;
            color: var(--text-dim);
            background: var(--bg);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .priority-high { color: var(--red); }
        .priority-medium { color: var(--yellow); }
        .priority-low { color: var(--text-dim); }

        /* Responsive */
        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        .thinking {
            display: none;
            padding: 16px 24px;
            color: var(--text-dim);
            font-size: 13px;
        }
        .thinking.active { display: block; }
        .thinking::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%   { content: '.'; }
            33%  { content: '..'; }
            66%  { content: '...'; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>DREAM TEAM</h1>
        <div class="header-right">
            <span><span class="status-dot"></span> Online</span>
            <button class="btn" onclick="openModal('github')">GitHub Repos</button>
            <button class="btn" onclick="openModal('addProject')">+ Project</button>
            <button class="btn" onclick="openModal('addTask')">+ Task</button>
            <button class="btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Layout -->
    <div class="layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Chat Tabs -->
            <div class="sidebar-section">
                <h3>Chats</h3>
                <div class="agent-card active" data-chat="cto" onclick="switchChat('cto')">
                    <div class="name">CTO <span class="status-badge status-idle" id="ctoStatus">IDLE</span></div>
                    <div class="meta">Strategy & delegation</div>
                </div>
                <div id="agentChatTabs"></div>
            </div>

            <!-- Tasks -->
            <div class="sidebar-section">
                <h3>Recent Tasks</h3>
                <div id="tasksList">
                    <div style="color: var(--text-dim); font-size: 12px; padding: 8px;">
                        No tasks yet.
                    </div>
                </div>
            </div>
        </div>

        <!-- Main -->
        <div class="main">
            <div class="chat-area" id="chatArea"></div>
            <div class="thinking" id="thinking">Thinking</div>
            <div class="input-area">
                <div class="input-row">
                    <input type="text" id="messageInput" placeholder="Talk to the CTO..."
                           autofocus autocomplete="off">
                    <button class="btn btn-primary" onclick="sendMessage()" id="sendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Project Modal -->
    <div class="modal-overlay" id="addProjectModal">
        <div class="modal">
            <h2>Add Project</h2>
            <div class="form-group">
                <label>Repository URL</label>
                <input type="text" id="projUrl" placeholder="https://github.com/user/repo">
            </div>
            <div class="form-group">
                <label>Project Name</label>
                <input type="text" id="projName" placeholder="my-project">
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="projDesc" placeholder="What this project does">
            </div>
            <div class="form-group">
                <label>Tech Stack (comma-separated)</label>
                <input type="text" id="projStack" placeholder="python, react, postgres">
            </div>
            <div class="form-group">
                <label>Branch</label>
                <input type="text" id="projBranch" placeholder="main" value="main">
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('addProject')">Cancel</button>
                <button class="btn btn-primary" onclick="addProject()">Add Project</button>
            </div>
        </div>
    </div>

    <!-- Add Task Modal -->
    <div class="modal-overlay" id="addTaskModal">
        <div class="modal">
            <h2>Create Task</h2>
            <div class="form-group">
                <label>Project</label>
                <input type="text" id="taskProject" placeholder="project-name">
            </div>
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="taskTitle" placeholder="Task title">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="taskDesc" rows="3" placeholder="Detailed task description"></textarea>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <input type="text" id="taskPriority" placeholder="high / medium / low" value="medium">
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="taskExecute" checked>
                <label for="taskExecute" style="margin: 0;">Execute immediately</label>
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('addTask')">Cancel</button>
                <button class="btn btn-primary" onclick="createTask()">Create Task</button>
            </div>
        </div>
    </div>

    <!-- GitHub Repos Modal -->
    <div class="modal-overlay" id="githubModal">
        <div class="modal" style="max-width: 650px;">
            <h2>GitHub Repositories</h2>
            <div style="margin-bottom: 16px; display: flex; gap: 12px;">
                <button class="btn btn-primary" onclick="loadGithubRepos()" id="loadReposBtn">Load Repos</button>
                <button class="btn" onclick="importAllRepos()" id="importAllBtn">Import All & Assign Agents</button>
            </div>
            <div id="githubReposList" style="max-height: 400px; overflow-y: auto;">
                <div style="color: var(--text-dim); font-size: 13px; padding: 8px;">
                    Click "Load Repos" to fetch your GitHub repositories.
                </div>
            </div>
            <div class="form-actions">
                <button class="btn" onclick="closeModal('github')">Close</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let activeChat = 'cto';
        // Store chat history per tab: { 'cto': [{type, role, content, time}], 'repo-name': [...] }
        const chatHistory = { cto: [{type:'system', role:'System', content:'Welcome to DREAM Team. Talk to your CTO — give ideas, feedback, or direction.\n\nType naturally, e.g.:\n  "Add dark mode to the fitness app"\n  "What\'s the status across all projects?"'}] };

        // --- WebSocket ---
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onopen = () => console.log('WS connected');
            ws.onclose = () => setTimeout(connectWS, 3000);
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'init') renderTeam(msg.team);
                else if (msg.type === 'project_added') {
                    refreshTeam();
                    pushMsg('cto', 'system', 'System', `Project "${msg.project}" added with agent ${msg.agent.name}`);
                } else if (msg.type === 'task_started') {
                    refreshTeam();
                    const proj = msg.task.project;
                    pushMsg(proj in chatHistory ? proj : 'cto', 'system', 'System', `Task "${msg.task.title}" started`);
                }
            };
        }

        // --- API calls ---
        async function api(method, path, body) {
            const opts = { method, headers: {'Content-Type': 'application/json'} };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(path, opts);
            if (res.status === 401) { window.location.href = '/login'; return null; }
            return res.json();
        }

        async function refreshTeam() {
            const data = await api('GET', '/api/team/status');
            if (data) renderTeam(data);
        }

        // --- Render ---
        function renderTeam(data) {
            const tabsEl = document.getElementById('agentChatTabs');
            const agents = Object.values(data.agents || {});
            tabsEl.innerHTML = agents.map(a => {
                const isActive = activeChat === a.repo_name ? ' active' : '';
                // Ensure chat history exists for this agent
                if (!chatHistory[a.repo_name]) {
                    chatHistory[a.repo_name] = [{type:'system', role:'System', content:`Chat with ${a.name} (${a.repo_name})\nTech: ${(a.tech_stack||[]).join(', ') || 'N/A'}\n\nAsk about the project, give tasks, or discuss code.`}];
                }
                return `<div class="agent-card${isActive}" data-chat="${a.repo_name}" onclick="switchChat('${a.repo_name}')">
                    <div class="name">${escapeHtml(a.name)} <span class="status-badge status-${a.status}">${a.status.toUpperCase()}</span></div>
                    <div class="meta">${escapeHtml(a.repo_name)}</div>
                </div>`;
            }).join('');

            // Tasks
            const tasksEl = document.getElementById('tasksList');
            const summary = data.tasks || {};
            const byStatus = summary.by_status || {};
            if (summary.total > 0) {
                tasksEl.innerHTML = `<div style="font-size:12px;padding:4px 8px;color:var(--text-dim);">
                    Total: ${summary.total} | ${Object.entries(byStatus).map(([k,v]) => `${k}: ${v}`).join(' | ')}
                </div>`;
            }
        }

        // --- Chat tab switching ---
        function switchChat(chatId) {
            activeChat = chatId;
            // Update sidebar active state
            document.querySelectorAll('.agent-card').forEach(el => {
                el.classList.toggle('active', el.dataset.chat === chatId);
            });
            // Update placeholder
            const input = document.getElementById('messageInput');
            input.placeholder = chatId === 'cto' ? 'Talk to the CTO...' : `Talk to ${chatId} agent...`;
            // Render chat history
            renderChatArea();
            input.focus();
        }

        function renderChatArea() {
            const chatArea = document.getElementById('chatArea');
            const messages = chatHistory[activeChat] || [];
            chatArea.innerHTML = messages.map(m => `
                <div class="message ${m.type}">
                    <div class="message-header"><span class="role">${escapeHtml(m.role)}</span> &mdash; ${m.time || ''}</div>
                    <div class="message-body">${escapeHtml(m.content)}</div>
                </div>
            `).join('');
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function pushMsg(chatId, type, role, content) {
            if (!chatHistory[chatId]) chatHistory[chatId] = [];
            chatHistory[chatId].push({type, role, content, time: new Date().toLocaleTimeString()});
            if (chatId === activeChat) renderChatArea();
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // --- Streaming helper ---
        async function streamSSE(url, body, chatId, roleName) {
            let res;
            try {
                res = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body),
                });
            } catch (e) {
                document.getElementById('thinking').classList.remove('active');
                pushMsg(chatId, 'system', 'System', 'Network error: ' + e.message);
                return;
            }
            if (res.status === 401) { window.location.href = '/login'; return; }
            if (!res.ok) {
                document.getElementById('thinking').classList.remove('active');
                let errText = '';
                try { const j = await res.json(); errText = j.detail || JSON.stringify(j); } catch(e) { errText = res.statusText; }
                pushMsg(chatId, 'system', 'System', 'Error (' + res.status + '): ' + errText);
                return;
            }

            document.getElementById('thinking').classList.remove('active');

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';
            let buffer = '';
            // Add placeholder to history
            const msgIdx = chatHistory[chatId].length;
            chatHistory[chatId].push({type:'cto', role:roleName, content:'', time: new Date().toLocaleTimeString()});

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.chunk) {
                                fullText += data.chunk;
                                chatHistory[chatId][msgIdx].content = fullText;
                                if (chatId === activeChat) renderChatArea();
                            }
                        } catch (e) {}
                    }
                }
            } catch (e) {
                if (!fullText) {
                    pushMsg(chatId, 'system', 'System', 'Stream error: ' + e.message);
                }
            }

            // Remove empty placeholder if nothing was streamed
            if (!fullText && chatHistory[chatId][msgIdx] && !chatHistory[chatId][msgIdx].content) {
                chatHistory[chatId].splice(msgIdx, 1);
                if (chatId === activeChat) renderChatArea();
            }
        }

        // --- Send message ---
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = '';
            pushMsg(activeChat, 'user', 'You', msg);
            document.getElementById('thinking').classList.add('active');
            document.getElementById('sendBtn').disabled = true;

            try {
                if (activeChat === 'cto') {
                    await streamSSE('/api/cto/talk', { message: msg }, 'cto', 'CTO');
                } else {
                    await streamSSE(`/api/projects/${activeChat}/chat`, { message: msg }, activeChat, activeChat);
                }
            } catch (e) {
                document.getElementById('thinking').classList.remove('active');
                pushMsg(activeChat, 'system', 'System', 'Error: ' + e.message);
            }
            document.getElementById('sendBtn').disabled = false;
        }

        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        // --- Projects ---
        async function addProject() {
            const url = document.getElementById('projUrl').value.trim();
            const name = document.getElementById('projName').value.trim() || url.split('/').pop().replace('.git', '');
            const desc = document.getElementById('projDesc').value.trim();
            const stack = document.getElementById('projStack').value.split(',').map(s => s.trim()).filter(Boolean);
            const branch = document.getElementById('projBranch').value.trim() || 'main';
            if (!url) return alert('Repository URL is required');
            closeModal('addProject');
            pushMsg('cto', 'system', 'System', `Adding project "${name}"...`);
            try {
                const data = await api('POST', '/api/projects', { name, repo_url: url, description: desc, tech_stack: stack, branch });
                if (data) { pushMsg('cto', 'system', 'System', `Project "${name}" added! Agent: ${data.agent.name}`); refreshTeam(); }
            } catch (e) { pushMsg('cto', 'system', 'System', 'Error adding project: ' + e.message); }
        }

        // --- Tasks ---
        async function createTask() {
            const project = document.getElementById('taskProject').value.trim();
            const title = document.getElementById('taskTitle').value.trim();
            const desc = document.getElementById('taskDesc').value.trim();
            const priority = document.getElementById('taskPriority').value.trim() || 'medium';
            const execute = document.getElementById('taskExecute').checked;
            if (!project || !title) return alert('Project and title are required');
            closeModal('addTask');
            const chatId = project in chatHistory ? project : 'cto';
            pushMsg(chatId, 'system', 'System', `Creating task "${title}" for ${project}...`);
            try {
                const data = await api('POST', '/api/tasks', { project, title, description: desc || title, priority, execute });
                if (data) { pushMsg(chatId, 'system', 'System', `Task created: ${data.task.task_id}`); refreshTeam(); }
            } catch (e) { pushMsg(chatId, 'system', 'System', 'Error creating task: ' + e.message); }
        }

        // --- GitHub ---
        async function loadGithubRepos() {
            const el = document.getElementById('githubReposList');
            const btn = document.getElementById('loadReposBtn');
            btn.disabled = true;
            el.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:8px;">Loading repos...</div>';
            try {
                const data = await api('GET', '/api/github/repos');
                if (!data || !data.repos || data.repos.length === 0) {
                    el.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:8px;">No repos found. Ensure gh CLI is authenticated on the server.</div>';
                    btn.disabled = false; return;
                }
                el.innerHTML = data.repos.map(r => `
                    <div class="task-item">
                        <div class="task-title">
                            <strong>${escapeHtml(r.name)}</strong>
                            <span style="color:var(--text-dim);font-size:11px;margin-left:8px;">${escapeHtml(r.language || '')}</span>
                            <div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${escapeHtml(r.description || 'No description')}</div>
                        </div>
                        <button class="btn btn-sm" onclick="assignAgent('${escapeHtml(r.name)}', this)">Assign Agent</button>
                    </div>
                `).join('');
            } catch (e) {
                el.innerHTML = '<div style="color:var(--red);font-size:13px;padding:8px;">Error: ' + escapeHtml(e.message) + '</div>';
            }
            btn.disabled = false;
        }

        async function assignAgent(repoName, btn) {
            btn.disabled = true; btn.textContent = 'Assigning...';
            try {
                const data = await api('POST', `/api/github/repos/${repoName}/assign`);
                if (data && data.agent) {
                    btn.textContent = 'Assigned'; btn.style.borderColor = 'var(--green)'; btn.style.color = 'var(--green)';
                    pushMsg('cto', 'system', 'System', `Agent "${data.agent.name}" assigned to ${repoName}`);
                    refreshTeam();
                }
            } catch (e) { btn.textContent = 'Error'; btn.style.color = 'var(--red)'; }
        }

        async function importAllRepos() {
            const btn = document.getElementById('importAllBtn');
            btn.disabled = true; btn.textContent = 'Importing...';
            closeModal('github');
            pushMsg('cto', 'system', 'System', 'Importing all GitHub repos and assigning agents...');
            try {
                const data = await api('POST', '/api/github/import-all?exclude=dream-team');
                if (data && data.results) {
                    const assigned = data.results.filter(r => r.status === 'assigned');
                    const existing = data.results.filter(r => r.status === 'already_assigned');
                    const errors = data.results.filter(r => r.status === 'error');
                    let msg = `Import complete: ${assigned.length} new agents assigned`;
                    if (existing.length) msg += `, ${existing.length} already had agents`;
                    if (errors.length) msg += `, ${errors.length} errors`;
                    pushMsg('cto', 'system', 'System', msg);
                    refreshTeam();
                }
            } catch (e) { pushMsg('cto', 'system', 'System', 'Import error: ' + e.message); }
            btn.disabled = false; btn.textContent = 'Import All & Assign Agents';
        }

        // --- Modals ---
        function openModal(name) { document.getElementById(name + 'Modal').classList.add('active'); }
        function closeModal(name) { document.getElementById(name + 'Modal').classList.remove('active'); }

        // --- Auth ---
        async function logout() { await api('POST', '/api/auth/logout'); window.location.href = '/login'; }

        // --- Init ---
        connectWS();
        refreshTeam();
        renderChatArea();
    </script>
</body>
</html>
